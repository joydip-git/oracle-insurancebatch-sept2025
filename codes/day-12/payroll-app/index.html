<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayRoll App</title>
</head>

<body>
    <fieldset>
        <legend>Employee Information</legend>        
        <form>
            <div>
                <label for="radioDev">Developer:&nbsp;</label>
                <input type="radio" name="employees" id="radioDev">
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <label for="radioHr">Hr: &nbsp;</label>
                <input type="radio" name="employees" id="radioHr">
            </div>
            <div>
                <label for="txtName">Name: &nbsp;</label>
                <input type="text" id="txtName" />
            </div>
            <div>
                <input type="button" value="Add">
            </div>
        </form>
    </fieldset>
</body>

</html>
