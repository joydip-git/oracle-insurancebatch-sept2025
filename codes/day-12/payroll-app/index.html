<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayRoll App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</head>

<body>
    <div class="container container-fluid">
        <fieldset>
            <legend>Employee Information</legend>
            <div class="mb-3" style="margin-top: 20px;">
                <form>
                    <div style="text-align: center;" class="form-check form-check-inline">
                        <label for="radioDev" class="form-check-label">Developer:&nbsp;</label>
                        <input type="radio" name="employees" id="radioDev" checked class="form-check-input">
                    </div>
                    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                    <div class="form-check form-check-inline">
                        <label for="radioHr" class="form-check-label">Hr: &nbsp;</label>
                        <input class="form-check-input" type="radio" name="employees" id="radioHr">
                    </div>
                    <div>
                        <label for="txtId" class="form-label">Id: &nbsp;</label>
                        <input class="form-control" type="text" id="txtId" />
                    </div>
                    <div>
                        <label class="form-label" for="txtName">Name: &nbsp;</label>
                        <input class="form-control" type="text" id="txtName" />
                    </div>
                    <div>
                        <label class="form-label" for="txtBasic">Basic: &nbsp;</label>
                        <input class="form-control" type="text" id="txtBasic" />
                    </div>
                    <div>
                        <label class="form-label" for="txtDa">Da: &nbsp;</label>
                        <input class="form-control" type="text" id="txtDa" />
                    </div>
                    <div>
                        <label class="form-label" for="txtHra">Hra: &nbsp;</label>
                        <input class="form-control" type="text" id="txtHra" />
                    </div>
                    <div>
                        <label class="form-label" for="txtExtra" id="lblExtra">Extra: &nbsp;</label>
                        <input class="form-control" type="text" id="txtExtra" />
                    </div>
                    <div style="text-align: center;margin-top: 5px;">
                        <input class="btn btn-primary" type="button" value="Add" id="btnAdd">
                    </div>
                </form>
            </div>
            <div style="text-align: center;">
                <label id="msgSpan" class="form-label"></label>
            </div>
        </fieldset>
    </div>
    <script src="./src/index.js" type="module"></script>
</body>

</html>
