<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PayRoll App</title>
</head>

<body>
    <fieldset>
        <legend>Employee Information</legend>
        <form>
            <div>
                <label for="radioDev">Developer:&nbsp;</label>
                <input type="radio" name="employees" id="radioDev" checked>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
                <label for="radioHr">Hr: &nbsp;</label>
                <input type="radio" name="employees" id="radioHr">
            </div>
            <div>
                <label for="txtId">Id: &nbsp;</label>
                <input type="text" id="txtId" />
            </div>
            <div>
                <label for="txtName">Name: &nbsp;</label>
                <input type="text" id="txtName" />
            </div>
            <div>
                <label for="txtBasic">Basic: &nbsp;</label>
                <input type="text" id="txtBasic" />
            </div>
            <div>
                <label for="txtDa">Da: &nbsp;</label>
                <input type="text" id="txtDa" />
            </div>
            <div>
                <label for="txtHra">Hra: &nbsp;</label>
                <input type="text" id="txtHra" />
            </div>
            <div>
                <label for="txtExtra" id="lblExtra">Extra: &nbsp;</label>
                <input type="text" id="txtExtra" />
            </div>
            <div>
                <input type="button" value="Add" id="btnAdd">
            </div>
        </form>
        <br>
        <span id="msgSpan"></span>
    </fieldset>
    <script src="./src/index.js" type="module"></script>
</body>

</html>
